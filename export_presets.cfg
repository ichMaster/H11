[preset.0]

name="PocketTerm35 (Linux arm64)"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="pocketterm"
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, build/*"
export_path="build/h11.arm64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="arm64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="pi@pocketterm.local"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
# Runs under the Sway session of the logged-in user on the PocketTerm.
export XDG_RUNTIME_DIR=\"/run/user/$(id -u)\"
export WAYLAND_DISPLAY=\"$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]*$')\"
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" --display-driver wayland {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x -f \"{temp_dir}/{exe_name}\" 2>/dev/null) 2>/dev/null
rm -rf \"{temp_dir}\""
